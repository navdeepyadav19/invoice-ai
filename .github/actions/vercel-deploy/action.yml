name: Vercel deploy
description: Pull Vercel project settings, build on the runner, and upload the prebuilt output.

inputs:
  target:
    description: '"preview" or "production"'
    required: true

outputs:
  url:
    description: Deployment URL (empty if the preview deploy was skipped)
    value: ${{ steps.deploy.outputs.url }}
  previous-deployment:
    description: Id of the production deployment this one replaced (production only; empty on a first deploy)
    value: ${{ steps.previous.outputs.id }}

# Expects VERCEL_TOKEN, VERCEL_ORG_ID and VERCEL_PROJECT_ID in the job's env.
runs:
  using: composite
  steps:
    - name: Check Vercel secrets
      id: guard
      shell: bash
      env:
        TARGET: ${{ inputs.target }}
      run: |
        echo "TARGET=$TARGET" >> "$GITHUB_ENV"
        if [ -n "$VERCEL_TOKEN" ] && [ -n "$VERCEL_ORG_ID" ] && [ -n "$VERCEL_PROJECT_ID" ]; then
          echo "enabled=true" >> "$GITHUB_OUTPUT"
          exit 0
        fi
        msg="Add VERCEL_TOKEN, VERCEL_ORG_ID and VERCEL_PROJECT_ID under Settings → Secrets and variables → Actions."
        # A production deploy that silently didn't happen must not look green.
        if [ "$TARGET" = "production" ]; then
          echo "::error::Cannot deploy to production. $msg"
          exit 1
        fi
        echo "::warning::Skipping preview deploy. $msg"
        echo "enabled=false" >> "$GITHUB_OUTPUT"

    - name: Install Vercel CLI
      if: steps.guard.outputs.enabled == 'true'
      shell: bash
      run: npm install --global vercel@59.16.0 # Pinned: a CLI release shouldn't break deploys overnight.

    - name: Pull Vercel environment
      if: steps.guard.outputs.enabled == 'true'
      shell: bash
      # Downloads project settings and the env vars set in the Vercel dashboard
      # for this target, so secrets like Supabase keys never live in GitHub.
      run: vercel pull --yes --environment="$TARGET" --token="$VERCEL_TOKEN"

    - name: Build
      if: steps.guard.outputs.enabled == 'true'
      shell: bash
      run: |
        if [ "$TARGET" = "production" ]; then
          vercel build --prod --token="$VERCEL_TOKEN"
        else
          vercel build --token="$VERCEL_TOKEN"
        fi

    # Remember what production points at *before* replacing it, so a failed
    # smoke test can roll back to exactly this deployment.
    - name: Record current production deployment
      id: previous
      if: steps.guard.outputs.enabled == 'true' && inputs.target == 'production' && env.PRODUCTION_URL != ''
      shell: bash
      run: |
        id=$(vercel inspect "$PRODUCTION_URL" --json --token="$VERCEL_TOKEN" 2>/dev/null | jq -r '.id // empty') || id=""
        echo "id=$id" >> "$GITHUB_OUTPUT"
        echo "Current production deployment: ${id:-none}"

    - name: Deploy
      id: deploy
      if: steps.guard.outputs.enabled == 'true'
      shell: bash
      run: |
        flags=(--prebuilt --token="$VERCEL_TOKEN")
        if [ "$TARGET" = "production" ]; then flags+=(--prod); fi
        url=$(vercel deploy "${flags[@]}")
        echo "url=$url" >> "$GITHUB_OUTPUT"
        echo "### Deployed to $TARGET: $url" >> "$GITHUB_STEP_SUMMARY"
