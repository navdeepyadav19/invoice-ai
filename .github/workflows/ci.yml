# CI checks: the quality gate every change must pass.
#
# This is a reusable workflow (workflow_call). It never runs on its own;
# pull-request.yml and production.yml both call it, so a PR and a merge to
# main are held to exactly the same checks.
#
# The jobs run in parallel, so one failing check doesn't hide another.

name: CI

on:
  workflow_call:

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: pnpm lint

  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      # Pages use the global PageProps/LayoutProps/RouteContext types, which
      # Next generates into .next/types. A fresh checkout has no .next folder,
      # so tsc would fail without this step.
      - name: Generate Next.js route types
        run: pnpm exec next typegen
      - run: pnpm typecheck

  test:
    name: Unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: pnpm test

  # The published API reference (api-docs/openapi.json, rendered by Mintlify)
  # and the Postman collection are generated from lib/api/openapi.ts and
  # committed. Regenerate both and fail on any diff, so a contract change that
  # forgot `pnpm openapi:gen && pnpm postman:gen` cannot merge.
  api-docs:
    name: API docs up to date
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: pnpm openapi:gen
      - run: pnpm postman:gen
      - name: Fail if generated docs drifted
        run: |
          if ! git diff --exit-code -- api-docs/openapi.json docs/platform/postman; then
            echo "::error::Generated API docs are stale. Run 'pnpm openapi:gen && pnpm postman:gen' and commit the result."
            exit 1
          fi
          # A newly generated file that was never committed is drift too.
          untracked=$(git ls-files --others --exclude-standard -- api-docs/openapi.json docs/platform/postman)
          if [ -n "$untracked" ]; then
            echo "::error::Generated API docs are not committed: $untracked"
            exit 1
          fi

  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_TELEMETRY_DISABLED: 1
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      # Supabase and API keys are read at request time, not build time, so the
      # build needs no secrets. If a future change makes it need one, this
      # job is where you'll find out.
      - run: pnpm build

  # packages/sdk-ts (@horizonpay/invoice-ai). The resource classes and types are
  # generated from api-docs/openapi.json and committed, like the API docs above:
  # regenerate and fail on any diff, so a spec change can't ship without the
  # SDK that matches it. Then build once and run the unit tests on every Node
  # version the package supports.
  sdk-ts:
    name: TypeScript SDK (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node: [18, 20, 22]
    steps:
      - uses: actions/checkout@v7
      # pnpm 11 itself needs Node 22+, so install, generate and build on the
      # repo's Node first, then switch to the matrix version to test.
      - uses: ./.github/actions/setup
      - run: pnpm sdk:gen
      - name: Fail if the generated SDK drifted
        run: |
          if ! git diff --exit-code -- packages/sdk-ts/src; then
            echo "::error::The TypeScript SDK is stale. Run 'pnpm sdk:gen' and commit the result."
            exit 1
          fi
          untracked=$(git ls-files --others --exclude-standard -- packages/sdk-ts/src)
          if [ -n "$untracked" ]; then
            echo "::error::Generated SDK files are not committed: $untracked"
            exit 1
          fi
      - run: pnpm --filter @horizonpay/invoice-ai typecheck
      - run: pnpm --filter @horizonpay/invoice-ai build
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
      - name: Unit tests
        working-directory: packages/sdk-ts
        run: ./node_modules/.bin/vitest run
      - name: Smoke-test the built package (CJS + ESM)
        working-directory: packages/sdk-ts
        run: |
          node -e "const m = require('./dist/index.cjs'); if (typeof m.InvoiceAI !== 'function') process.exit(1)"
          node --input-type=module -e "const m = await import('./dist/index.js'); if (typeof m.default !== 'function') process.exit(1)"
      # Every SDK method against a Prism mock of the spec. Skips itself if
      # Prism can't be downloaded, so it never blocks on a registry outage.
      - name: Contract tests (Prism)
        if: matrix.node == 22
        working-directory: packages/sdk-ts
        run: ./node_modules/.bin/vitest run --config vitest.contract.config.ts

  # packages/sdk-python (horizonpay-invoice-ai). Lint, type-check and unit-test on
  # every Python version the package supports. On one version, also regenerate
  # the SDK from api-docs/openapi.json (resources through scripts/sdk-gen/python.ts,
  # models through datamodel-code-generator) and fail on any diff, and run every
  # method against a Prism mock of the spec.
  sdk-python:
    name: Python SDK (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ['3.9', '3.10', '3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10
        with:
          python-version: ${{ matrix.python }}
          enable-cache: true
          cache-dependency-glob: packages/sdk-python/uv.lock
      - name: Install
        working-directory: packages/sdk-python
        run: uv sync --locked
      - name: Lint
        working-directory: packages/sdk-python
        run: uv run ruff check
      - name: Type-check
        working-directory: packages/sdk-python
        run: uv run mypy invoice_ai
      - name: Unit tests
        working-directory: packages/sdk-python
        run: uv run pytest
      - if: matrix.python == '3.13'
        uses: ./.github/actions/setup
      - name: Regenerate the SDK
        if: matrix.python == '3.13'
        run: pnpm sdk:gen
      - name: Fail if the generated SDK drifted
        if: matrix.python == '3.13'
        run: |
          if ! git diff --exit-code -- packages/sdk-python; then
            echo "::error::The Python SDK is stale. Run 'pnpm sdk:gen' and commit the result."
            exit 1
          fi
          untracked=$(git ls-files --others --exclude-standard -- packages/sdk-python)
          if [ -n "$untracked" ]; then
            echo "::error::Generated SDK files are not committed: $untracked"
            exit 1
          fi
      # Skips itself if Prism can't be downloaded, so it never blocks on a registry outage.
      - name: Contract tests (Prism)
        if: matrix.python == '3.13'
        working-directory: packages/sdk-python
        run: uv run pytest -m contract
