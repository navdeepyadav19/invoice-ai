# Production pipeline: runs on every merge (push) to main.
#
#   Merge to main  ──►  CI (lint · typecheck · unit tests · build)
#
# Deploying is Vercel's job: its GitHub integration builds main and promotes it
# to production by itself. post-deploy.yml then smoke-tests the live site.

name: Production Pipeline

on:
  push:
    branches: [main]
  workflow_dispatch: # "Run workflow" button: re-run the checks on main by hand.

permissions:
  contents: read

# Queue runs on main one at a time.
concurrency:
  group: production
  cancel-in-progress: false

jobs:
  ci:
    name: CI
    uses: ./.github/workflows/ci.yml
