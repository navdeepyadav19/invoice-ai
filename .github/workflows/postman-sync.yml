# Publishes the generated Postman collection and environment to the public
# Postman workspace behind the docs' "Run in Postman" button
# (api-docs/postman.mdx). The button follows the collection, so replacing it
# in place here is what keeps the button current. See lib/postman/sync.ts.
#
# Needs the repo secret POSTMAN_API_KEY (a Postman API key that can edit the
# workspace). The workspace is found by name, "Invoice-AI API" unless the
# variable POSTMAN_WORKSPACE_NAME says otherwise; POSTMAN_WORKSPACE_ID skips the
# lookup. Without the key the job reports a notice and does nothing.
name: Postman sync

on:
  push:
    branches: [main]
    paths:
      - docs/platform/postman/**
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: postman-sync
  cancel-in-progress: false

jobs:
  sync:
    if: github.repository == 'navdeepyadav19/invoice-ai'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: Push the collection and environment to Postman
        env:
          POSTMAN_API_KEY: ${{ secrets.POSTMAN_API_KEY }}
          POSTMAN_WORKSPACE_ID: ${{ vars.POSTMAN_WORKSPACE_ID }}
          POSTMAN_WORKSPACE_NAME: ${{ vars.POSTMAN_WORKSPACE_NAME }}
        run: |
          if [ -z "$POSTMAN_API_KEY" ]; then
            echo "::notice::POSTMAN_API_KEY is not set; skipping the Postman sync."
            exit 0
          fi
          pnpm postman:sync
