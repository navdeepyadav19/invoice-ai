# PR pipeline: runs when a pull request targets main.
#
#   CI (lint · typecheck · unit tests · build)  ──►  green checks unlock "Merge"
#
# GitHub runs this against the PR *merged into* main, not the branch alone,
# so it catches breakage that only appears once the two are combined.
#
# Preview deploys are not done here: Vercel's GitHub integration builds every
# PR on its own and posts the preview URL as a "Vercel" check and PR comment.

name: PR Pipeline

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

# Pushing a new commit to the PR cancels the now-outdated run.
concurrency:
  group: pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  ci:
    name: CI
    uses: ./.github/workflows/ci.yml
