name: Feature request
description: Suggest something the app or the API should do.
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        Check the "Not built yet" list in the README first — it may already be planned.
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What are you trying to do, and what gets in the way today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What you'd like
      description: The behaviour you want. For API changes, the request/response shape you have in mind.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Workarounds you've tried
